<!DOCTYPE html>
<html lang="ja">
<head>

<title>Take to the sky デモ v0.3</title>
<style>
:root{--paper:#F6F5F1;--ink:#1F1F1D;--graphite:#5B5A56;--sky:#2B5C8A;--band:#E6EFF6;--room:#EEF3F8;--gate:#E4ECF4;--runway:#E6E3DC;--edge:#CFCBC3;--sign:#24272B;--signText:#F2C94C;--taxi:#D9B44A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:flex-start;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",sans-serif;color:var(--ink)}
#app{position:relative;width:390px;height:844px;flex:none;transform-origin:top center;background:var(--paper);overflow:hidden}
.abs{position:absolute}
#band{left:0;top:0;width:390px;height:160px;background:linear-gradient(var(--band),var(--paper))}
#stagePill{left:16px;top:53px;height:32px;padding:0 14px;border-radius:16px;background:#fff;display:flex;align-items:center;font-size:15px;font-weight:700}
#restart{right:8px;top:47px;height:44px;padding:0 10px;border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--graphite);cursor:pointer}
#nextLbl{left:16px;top:111px;font-size:12px;font-weight:700;color:var(--graphite)}
#dots{left:270px;top:108px;font-size:15px;color:var(--graphite)}
#waitLbl{right:16px;top:101px;font-size:12px;color:var(--graphite);text-align:right}
#waitNum{right:16px;top:116px;font-size:17px;font-weight:700;text-align:right}
#room{left:16px;top:147px;width:358px;height:320px;border-radius:16px;background:var(--room)}

#roomCount{right:32px;top:159px;font-size:13px;font-weight:700;color:var(--graphite)}
.gate{width:77.5px;height:77px;top:377px;border-radius:12px;background:var(--gate)}
.gate .no{position:absolute;left:5px;top:5px;height:18px;padding:0 6px;border-radius:4px;background:var(--sign);color:#FFFFFF;font-size:12px;font-weight:700;line-height:18px;letter-spacing:.03em}
.gate .cnt{position:absolute;right:6px;top:6px;font-size:13px;font-weight:700;transform-origin:100% 50%}
.gate::before{content:'';position:absolute;left:calc(50% - .5px);top:50%;bottom:0;width:1px;background:var(--taxi);opacity:.6}
.gate .empty{position:absolute;left:50%;top:42px;transform:translateX(-50%);padding:0 6px;border-radius:4px;background:var(--gate);text-align:center;font-size:13px;line-height:20px;color:var(--graphite)}
#runway{left:16px;top:482px;width:358px;height:308px;border-radius:18px;background:var(--runway);border:1px solid var(--edge)}
#hint{left:16px;right:16px;top:798px;text-align:center;font-size:13px;color:var(--graphite);transition:color .2s}
#hint.warn{color:var(--ink);font-weight:600}
.pax{left:0;top:0;width:26px;height:32px;transition:transform .32s cubic-bezier(.3,.9,.4,1),opacity .28s ease;will-change:transform}
.plane{left:0;top:0;cursor:pointer;will-change:transform}
.plane .pop{position:absolute;inset:0}
.plane.fly{z-index:20}
#fx,#confetti{left:0;top:0;width:390px;height:844px;pointer-events:none;overflow:visible}
#fx{z-index:15}
#confetti{z-index:25}
.badge{position:absolute;height:20px;padding:0 8px;border-radius:10px;background:#fff;border:1px solid var(--edge);font-size:12px;font-weight:700;line-height:18px;color:var(--ink);z-index:16;transform:translate(-50%,-50%)}
.spark{position:absolute;width:3px;height:9px;border-radius:2px;left:0;top:0}
#scrim{z-index:24}
#card,#sheet{z-index:30}
.plane .body{position:absolute;inset:0}
.plane .sym{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.plane .hit{position:absolute;left:50%;top:50%;width:88px;height:96px;transform:translate(-50%,-50%)}
.plane.atgate,.plane.gone{cursor:default}
#scrim{left:0;top:0;width:390px;height:844px;background:rgba(31,31,29,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{left:0;width:390px;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:24px 16px 50px;transform:translateY(110%);transition:transform .25s ease}
#sheet.on{transform:none}
#card{left:16px;width:358px;top:250px;background:#fff;border-radius:24px;padding:32px 16px 16px;text-align:center;opacity:0;pointer-events:none}
#card.on{opacity:1;pointer-events:auto}
h2{margin:0 0 8px;font-size:20px;font-weight:700}
#card h2{font-size:28px}
.sub{margin:0 0 24px;font-size:15px;color:var(--graphite)}
#card .sub{font-size:17px}
.primary{display:block;width:100%;height:56px;border:0;border-radius:16px;background:var(--sky);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
#card .primary{height:64px}
.primary:active{transform:scale(.98)}
#credit{left:0;right:0;top:826px;text-align:center;font-size:10px;color:#8C8A84;letter-spacing:.02em}
/* ---- 空港の飾り（v0.3。静止・読み上げなし・タップを通す） ---- */

#roomTitle{left:24px;top:155px;height:24px;padding:0 10px 0 8px;border-radius:5px;background:var(--sign);color:var(--signText);font-size:14px;line-height:24px;display:flex;align-items:center;gap:5px;letter-spacing:.04em}
#roomTitle svg{flex:none}

   札そのもの（.seat）は当たりなし。当たり（.seathit）は札と自分のマスの重なりだけ（隣の機のタップを取らない）。
   札は盤面の縮小に合わせて縮めない（実寸）。位置だけ盤面に合わせる ---- */
#seats{position:absolute;left:0;top:0;width:0;height:0}
.seat{position:absolute;display:flex;align-items:center;gap:2px;height:16px;padding:0 5px;box-sizing:border-box;border-radius:8px;background:#FFFFFF;border:1px solid var(--edge);color:var(--ink);font-size:11px;font-weight:700;line-height:14px;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none;transform-origin:0 0;transform:scale(var(--seatInv,1));transition:opacity .15s ease}
.seat svg{flex:none;display:block;width:7px;height:10px}
#app.seat-numonly .seat svg{display:none}
#app.dt-large .seat{height:20px;font-size:14px;line-height:18px;border-radius:10px}
#app.dt-large .seat svg{width:9px;height:13px}
#app.dt-large.dt-cap .seat{height:19px;font-size:13px;line-height:17px;border-radius:9.5px}
#app.dt-large.dt-cap .seat svg{width:8.5px;height:12px}
/* 札は破線・縁の灯火（#decorRunway）より上の層 */
.seathit{position:absolute;pointer-events:auto;cursor:pointer}
.seat.off{opacity:0}
.seathit.off{pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

<script>// Take to the sky — ゲームの中心ルール（DOM なし・純粋関数）。Swift 版へ移すときの手本。

  function createGame(rules, stage) {
    var cap = rules.boardingArea.capacity;
    var passengers = stage.passengers.map(function (c, i) { return { id: i, color: c, plane: null }; });
    var slots = [], i;
    for (i = 0; i < cap; i++) slots.push(i < passengers.length ? i : null);
    var queue = [];
    for (i = cap; i < passengers.length; i++) queue.push(i);
    var planes = stage.planes.map(function (p) {
      return { id: p.id, color: p.color, size: p.size, col: p.col, row: p.row, dir: p.dir,
               seats: rules.seats[p.size], filled: 0, status: 'runway', gate: null, arrival: null };
    });
    var gates = []; for (i = 0; i < rules.gates.base; i++) gates.push(null);
    var s = { cols: stage.board.cols, rows: stage.board.rows, planes: planes, gates: gates,
              slots: slots, queue: queue, passengers: passengers, arrivals: 0, moves: [] };
    checkSeats(s);
    return s;
  }

  // 色＋記号ごとに「座席の合計＝乗客数」（#39）
  function checkSeats(s) {
    var need = {};
    s.passengers.forEach(function (p) { need[p.color] = (need[p.color] || 0) + 1; });
    s.planes.forEach(function (p) { need[p.color] = (need[p.color] || 0) - p.seats; });
    Object.keys(need).forEach(function (k) { if (need[k] !== 0) throw new Error('seat mismatch: ' + k + ' ' + need[k]); });
  }

  function planeById(s, id) { for (var i = 0; i < s.planes.length; i++) if (s.planes[i].id === id) return s.planes[i]; return null; }

    for (var i = 0; i < s.planes.length; i++) { var p = s.planes[i]; if (p.status === 'runway' && p.col === c && p.row === r) return p; }
    return null;
  }
  function hasMatch(s, color) {
    return s.slots.some(function (pid) { return pid !== null && s.passengers[pid].color === color; });
  }
  function pathClear(s, p) {
    var d = DIRS[p.dir], c = p.col + d[0], r = p.row + d[1];
    while (c >= 0 && r >= 0 && c < s.cols && r < s.rows) { if (planeAt(s, c, r)) return false; c += d[0]; r += d[1]; }
    return true;
  }

  // 動けるか。確認の順は 1章の図のとおり：一致する客 → 前が端まで空き → 空きゲート
  function canMove(s, id) {

    return s.planes.filter(function (p) { return p.status === 'runway' && canMove(s, p.id) === 'ok'; })
                   .map(function (p) { return p.id; });

  function boardAll(s) {
    var out = [];
    var gatePlanes = s.gates.filter(function (id) { return id !== null; }).map(function (id) { return planeById(s, id); })
      .sort(function (a, b) { return a.arrival - b.arrival; });

    }

  }
  // 空いた枠へ、外の待機列の先頭から見えている順に入る（#41）。枠は番号の小さい順。
  function refill(s) {
    var out = [];
    for (var i = 0; i < s.slots.length && s.queue.length; i++) {
      if (s.slots[i] === null) { var pid = s.queue.shift(); s.slots[i] = pid; out.push({ pid: pid, slot: i }); }
    }
    return out;
  }

  // 1回のタップ。phases は演出用の段階ごとの状態（UI はこれを順に描くだけ）。
  function tap(state, id, fast) {
    var why = canMove(state, id);

    var s = clone(state), phases = [];
    var p = planeById(s, id), g = freeGate(s);

      var t = takeoffFull(s); if (t.length && !fast) phases.push({ type: 'takeoff', items: t, state: clone(s) });
      var r = refill(s); if (r.length && !fast) phases.push({ type: 'refill', items: r, state: clone(s) });
      if (!b.length && !t.length && !r.length) break;
    }

  }

  function key(s) {
    var run = s.planes.filter(function (p) { return p.status === 'runway'; }).map(function (p) { return p.id; }).join(',');
    var gates = s.gates.map(function (id) { return id === null ? '-' : id + ':' + planeById(s, id).filled; }).join(',');
    var area = s.slots.filter(function (x) { return x !== null; }).map(function (pid) { return s.passengers[pid].color[0]; }).sort().join('');
    return run + '|' + gates + '|' + area + '|' + s.queue.length;
  }
  // 解けるかの確認（深さ優先＋局面のメモ化、5章と同じ考え方）
  function solve(state, limit) {
    limit = limit || 200000; var seen = {}, count = 0;
    function dfs(s) {
      if (isClear(s)) return [];

      var k = key(s); if (seen[k]) return null; seen[k] = true;
      var ms = legalMoves(s);
      for (var i = 0; i < ms.length; i++) {
        var res = dfs(tap(s, ms[i], true).state);

      return null;

  }
  // でたらめに遊んだときのクリア率（難しさの目安）
  function randomClearRate(state, trials, seed) {

      if (isClear(s)) win++;
    }

  }
  function mulberry32(a) {
    return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

</script>

var PLANE_PATH = (function(){ var q = new Path2D(); q.roundRect(42, 3, 16, 91, 8); q.moveTo(50,36); q.lineTo(95,58); q.lineTo(95,66); q.lineTo(50,59); q.lineTo(5,66); q.lineTo(5,58); q.closePath();

var HIT_CTX = document.createElement('canvas').getContext('2d'); HIT_CTX.lineWidth = 4; HIT_CTX.lineJoin = 'round';
function inPlane(pl, x, y){ // 盤面の点 (x,y) が機 pl の外形の中か
  var c = cellCenter(pl.col, pl.row), l = R.planeLengthPt.runway[pl.size], t = DIR_DEG[pl.dir] * Math.PI / 180;
  var dx = x - c.x, dy = y - c.y, lx = dx * Math.cos(t) + dy * Math.sin(t), ly = -dx * Math.sin(t) + dy * Math.cos(t);

function gapToPlane(pl, r, maxGap){ // 札の四角 r と機の外形のすき間（maxGap まで、0.5pt 刻み）。重なれば 0
  for (var g = 0; g <= maxGap; g += 0.5){

// 満たせないときの順番：(a) 盤面のすべての札を数字だけにする（1枚でも必要なら全部）→ (b) その札だけ機の右下から左下へ → (c) 文字を大きくする設定をこの端末では13ptで止める
var SEAT_NUM_ONLY = false, SEAT_DT_CAP = false, SEAT_HINT_SHOWN = false, SEAT_HINT_DUE = false;
function seatCandidate(pl, corner, ke, inv){
  var se = seatEls[pl.id], len = R.planeLengthPt.runway[pl.size], c = cellCenter(pl.col, pl.row), off = Math.round(len * 0.24 + 1);

  state.planes.forEach(function(o){ if (o !== pl && o.status === 'runway' && Math.abs(o.col - pl.col) <= 1 && Math.abs(o.row - pl.row) <= 1) nb = Math.min(nb, gapToPlane(o, r, 12)); });
  var own = gapToPlane(pl, r, 9);
  var inset = Math.min(r.x - RW.x, r.y - RW.y, RW.x + RW.w - r.x - r.w, RW.y + RW.h - r.y - r.h);
  return { corner: corner, r: r, nb: nb, own: own, inset: inset, ok: own >= 1 && nb >= 4 / ke && inset >= edge - 0.01 };
}
function layoutSeats(){
  if (!state) return;
  var ke = Math.min(BOARD_K, 1), inv = 1 / ke; // 盤面が縮むときだけ、札を逆に拡大して実寸に保つ
  app.style.setProperty('--seatInv', inv);
  var pls = state.planes.filter(function(pl){ var se = seatEls[pl.id]; return se && !se.pill.classList.contains('off'); });
  function setMode(numOnly, cap){ app.classList.toggle('seat-numonly', numOnly); app.classList.toggle('dt-cap', cap); }
  function tryAll(numOnly, cap, allowLeft){
    setMode(numOnly, cap);
    var picks = {}, allOk = true;
    pls.forEach(function(pl){
      var q = seatCandidate(pl, 'R', ke, inv);
      if (!q.ok && allowLeft){ var q2 = seatCandidate(pl, 'L', ke, inv); if (q2.ok) q = q2; }
      picks[pl.id] = q; if (!q.ok) allOk = false;
    });

  var steps = [[false, false, false], [true, false, false], [true, false, true], [true, true, true]].filter(function(st){

    se.pill.style.left = q.r.x + 'px'; se.pill.style.top = q.r.y + 'px';

    el.innerHTML = '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 10 10">' + symbol(col.symbol, 5, 5, 8.4, col.hex) + '</svg>';
    confEl.appendChild(el);
    var ang = -Math.PI / 2 + (rnd() * 2 - 1) * c.confettiSpreadRad, sp = c.confettiSpeedPtPerMs[0] + rnd() * (c.confettiSpeedPtPerMs[1] - c.confettiSpeedPtPerMs[0]);
    var dur = c.confettiMs[0] + rnd() * (c.confettiMs[1] - c.confettiMs[0]), spin = (rnd() * 2 - 1) * 540, kf = [];
    var ox = origin.x + (rnd() * 2 - 1) * 40;
    for (var s = 0; s <= 10; s++){
      var tm = dur * s / 10, x = ox + Math.cos(ang) * sp * tm * (1 - s / 30), y = origin.y + Math.sin(ang) * sp * tm + 0.5 * c.gravityPtPerMs2 * tm * tm;
      kf.push({ offset: s / 10, transform: 'translate(' + (x - sz/2) + 'px,' + (y - sz/2) + 'px) rotate(' + (spin * s / 10) + 'deg)', opacity: s < 7 ? 1 : 1 - (s - 7) / 3 });
    }
    el.animate(kf, { duration: dur, easing: 'linear', fill: 'forwards' });
  }
  setTimeout(function(){
    scrim.classList.add('on'); card.classList.add('on');
    card.animate([{ opacity: 0, transform: 'scale(' + c.cardPopFromScale + ')' }, { opacity: 1, transform: 'scale(1)' }], { duration: c.cardPopMs, easing: c.cardEasing });
  }, c.cardDelayMs);
}

// ---- 進行 ----
var HINT = '搭乗口の乗客と同じ色・同じ記号の飛行機をタップ';
// 数字だけの札が初めて出たときの案内（文言はオーナー確認済み 2026-11-03）。表示時間は4秒
var SEAT_HINT_TEXT = '数字は乗れる人数です', SEAT_HINT_MS = 4000;
var WHY = { 'no-match': '搭乗口に、同じ色・同じ記号の乗客がいません', 'blocked': '前に飛行機があって進めません', 'no-gate': '空いている搭乗ゲートがありません' };
function hint(t, warn){
  var h = document.getElementById('hint'); h.textContent = t; h.classList.toggle('warn', !!warn);
  clearTimeout(hintTimer); if (warn) hintTimer = setTimeout(function(){ hint(HINT); }, 1800);
}
function shake(id){
  var b = planeEls[id].querySelector('.body');
  b.animate([{ translate: '0 0' }, { translate: '-3px 0' }, { translate: '3px 0' }, { translate: '0 0' }], { duration: 220, easing: 'ease-in-out' });
}
function start(){
  epoch++; pending = 0; seq = 0; celebrated = false;
  state = L.createGame(R, S);
  visGate = state.gates.map(function(){ return null; }); gateWaiters = []; PV = {}; paxSeq = []; paxWhere = [];
  state.planes.forEach(function(p){ PV[p.id] = { seats: p.seats, filled: 0, gate: null, arrived: false, present: true, gateD: deferred(), arriveD: deferred(), fullD: deferred() }; });
  build();
  state.planes.forEach(function(p){ var c = cellCenter(p.col, p.row); setPlane(p.id, c.x, c.y, DIR_DEG[p.dir], 1, 1); });
  state.passengers.forEach(function(_, i){ paxSeq[i] = -1; paxWhere[i] = null; paxEls[i].style.transition = 'none'; });
  placePaxFromSnapshot(state, 0, 0);
  layoutSeats();
  for (var g = 0; g < visGate.length; g++) showGate(g);
  ['scrim', 'sheet', 'card'].forEach(function(k){ document.getElementById(k).classList.remove('on'); });
  hint(HINT);
  maybeSeatHint();
  checkEnd();
}
function runPhases(phases, ep){
  var chain = Promise.resolve(), id0 = phases[0].planeId;
  // 移動
  chain = allocGate(id0).then(function(g){ if (ep !== epoch) return; return animateMove(id0, g); })
    .then(function(){ if (ep !== epoch) return; PV[id0].arrived = true; PV[id0].arriveD.r(); showGate(PV[id0].gate); });
  phases.slice(1).forEach(function(ph){
    chain = chain.then(function(){
      if (ep !== epoch) return;
      if (ph.type === 'board'){
        var groups = {}; ph.items.forEach(function(it){ (groups[it.planeId] = groups[it.planeId] || []).push(it); });
        return Promise.all(Object.keys(groups).map(function(pid){ return boardGroup(pid, groups[pid], ph.seq, ep); }));
      }
      if (ph.type === 'takeoff'){
        // 満席の合図までは待ち、上昇は裏で続ける（その間も他の機はタップできる）
        ph.items.forEach(function(it){ pending++; takeoff(it.planeId, ep).then(function(){ if (ep === epoch){ pending--; checkEnd(); } }); });
        return wait(RM ? M.reducedMotion.takeoffBadgeHoldMs : M.full.pulseMs);
      }
      if (ph.type === 'refill'){
        placePaxFromSnapshot(ph.state, ph.seq, M.refill.staggerMs);
        return wait(M.refill.durationMs + M.refill.staggerMs * Math.min(ph.items.length, 8));
      }
    });
  });
  return chain;
}
function onTap(id){
  var res = L.tap(state, id);
  if (!res.ok){ if (res.reason !== 'not-on-runway'){ shake(id); hint(WHY[res.reason], true); } return false; }
  state = res.state;
  var ep = epoch; pending++;
  res.phases.forEach(function(ph){ ph.seq = ++seq; });
  runPhases(res.phases, ep).then(function(){ if (ep === epoch){ pending--; checkEnd(); } });
  return true;
}
function checkEnd(){
  if (pending > 0) return;
  var st = L.status(state);
  if (st === 'clear') maybeCelebrate(0);
  else if (st === 'stuck'){ document.getElementById('scrim').classList.add('on'); document.getElementById('sheet').classList.add('on'); document.getElementById('live').textContent = '動かせる飛行機がありません'; }
}
document.querySelectorAll('[data-act="retry"]').forEach(function(b){ b.addEventListener('click', start); });
// デモはステージ1のみ。本番では次のステージを読み込む。
document.querySelectorAll('[data-act="next"]').forEach(function(b){ b.addEventListener('click', start); });
document.getElementById('restart').addEventListener('click', start);
function fit(){ var k = Math.min(window.innerWidth / 390, window.innerHeight / 844); app.style.transform = 'scale(' + k + ')'; BOARD_K = k; layoutSeats(); maybeSeatHint(); }
window.addEventListener('resize', fit); fit();
start();
// 録画・確認用
window.TTS = { tap: onTap, state: function(){ return state; }, status: function(){ return L.status(state); },
  solution: function(){ return L.solve(state).moves; }, idle: function(){ return pending === 0; }, celebrated: function(){ return celebrated; }, restart: start, reducedMotion: RM, seatInfo: function(){ return SEAT_INFO; } };
})();
</script>
